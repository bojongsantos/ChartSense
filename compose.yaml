services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chartsense
      POSTGRES_PASSWORD: chartsense_dev
      POSTGRES_DB: chartsense
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartsense -d chartsense"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - chartsense_postgres:/var/lib/postgresql/data

volumes:
  chartsense_postgres:
